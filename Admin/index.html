<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FastVTU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #6c5ce7; --primary-dark: #5649c0; --secondary: #00d9ff; --success: #00b894; --danger: #ff4757; --warning: #ffa502; --dark: #2d3436; --light: #f5f6fa; --gray: #636e72; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--dark); color: white; padding: 1rem; }
        .sidebar h2 { margin-bottom: 2rem; color: var(--primary); }
        .sidebar a { display: block; color: white; text-decoration: none; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 5px; transition: all 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary); }
        .main-content { flex: 1; padding: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stat-card h3 { color: var(--gray); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: var(--dark); }
        .section { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 1rem; text-align: left; border-bottom: 1px solid #ddd; }
        .table th { background: var(--light); font-weight: 600; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚡ Admin Panel</h2>
        <a href="index.html" class="active">Dashboard</a>
        <a href="users.html">Manage Users</a>
        <a href="services.html">Services</a>
        <a href="transactions.html">Transactions</a>
        <a href="settings.html">Settings</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="main-content">
        <h1>Admin Dashboard</h1>
       
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="value" id="totalUsers">...</div>
            </div>
            <div class="stat-card">
                <h3>Total Transactions</h3>
                <div class="value" id="totalTxns">...</div>
            </div>
            <div class="stat-card">
                <h3>Revenue Today</h3>
                <div class="value" id="revenueToday">...</div>
            </div>
            <div class="stat-card">
                <h3>Pending Transactions</h3>
                <div class="value" id="pendingTxns">...</div>
            </div>
        </div>

        <div class="section">
            <h2>Recent Transactions</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="recentTransactions">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../main.js"></script>

    <script>
        // 2. Admin Security Check
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const token = localStorage.getItem('token');

        // Check if user exists AND has is_staff permission
        if (!token || !user.is_staff) {
            alert('Admin access required!');
            window.location.href = '../login.html';
        }

        // 3. Fetch Admin Data
        async function loadAdminStats() {
            try {
                // NOTE: You will need to create this specific endpoint in Django later!
                // For now, this will try to fetch, and catch error if it doesn't exist.
                const response = await fetch(`${API.baseURL}/api/admin/dashboard-stats/`, {
                    headers: API.getHeaders()
                });
               
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totalUsers').textContent = data.total_users || 0;
                    document.getElementById('totalTxns').textContent = data.total_transactions || 0;
                    document.getElementById('revenueToday').textContent = '₦' + (data.revenue || 0).toLocaleString();
                    document.getElementById('pendingTxns').textContent = data.pending_count || 0;
                } else {
                    console.log("Admin stats endpoint not ready yet.");
                    document.getElementById('totalUsers').textContent = "0";
                }

                // Fetch Recent Transactions (Admin View)
                const txResponse = await fetch(`${API.baseURL}/api/admin/transactions/`, {
                    headers: API.getHeaders()
                });

                if (txResponse.ok) {
                    const txData = await txResponse.json();
                    renderAdminTable(txData.results || txData);
                } else {
                    // Fallback to empty if endpoint missing
                    document.getElementById('recentTransactions').innerHTML = '<tr><td colspan="5">No transactions found (Endpoint missing)</td></tr>';
                }

            } catch (error) {
                console.error("Admin Load Error:", error);
                document.getElementById('recentTransactions').innerHTML = '<tr><td colspan="5">Error connecting to server</td></tr>';
            }
        }

        function renderAdminTable(transactions) {
            const tbody = document.getElementById('recentTransactions');
            tbody.innerHTML = transactions.map(tx => `
                <tr>
                    <td>${tx.user_email || tx.username || 'User'}</td>
                    <td>${tx.type || 'Service'}</td>
                    <td>₦${(tx.amount || 0).toLocaleString()}</td>
                    <td>
                        <span style="padding: 0.25rem 0.5rem; border-radius: 3px;
                        background: ${tx.status === 'success' ? 'rgba(0,184,148,0.1)' : 'rgba(255,165,2,0.1)'};
                        color: ${tx.status === 'success' ? 'var(--success)' : 'var(--warning)'};">
                        ${tx.status}
                        </span>
                    </td>
                    <td>${new Date(tx.created_at || tx.date).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }

        // Run on load
        loadAdminStats();
    </script>
</body>
</html>
