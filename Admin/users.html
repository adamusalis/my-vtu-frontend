<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - FastVTU Admin</title>
    <style>
        /* Shared Admin CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #6c5ce7; --primary-dark: #5649c0; --secondary: #00d9ff; --success: #00b894; --danger: #ff4757; --warning: #ffa502; --dark: #2d3436; --light: #f5f6fa; --gray: #636e72; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--dark); color: white; padding: 1rem; }
        .sidebar h2 { margin-bottom: 2rem; color: var(--primary); }
        .sidebar a { display: block; color: white; text-decoration: none; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 5px; transition: all 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary); }
        .main-content { flex: 1; padding: 2rem; }
        .section { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 1rem; text-align: left; border-bottom: 1px solid #ddd; }
        .table th { background: var(--light); font-weight: 600; }
        .btn { padding: 0.75rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; }
       
        /* User Specific Styles */
        .user-actions { display: flex; gap: 0.5rem; }
        .btn-small { padding: 0.5rem 1rem; font-size: 0.85rem; }
        .btn-edit { background: var(--warning); }
        .btn-delete { background: var(--danger); }
        .status-badge { padding: 0.25rem 0.5rem; border-radius: 3px; font-size: 0.85rem; font-weight: bold; }
        .status-badge.active { background: rgba(0,184,148,0.1); color: var(--success); }
        .status-badge.suspended { background: rgba(255, 71, 87, 0.1); color: var(--danger); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚡ Admin Panel</h2>
        <a href="index.html">Dashboard</a>
        <a href="users.html" class="active">Manage Users</a>
        <a href="services.html">Services</a>
        <a href="transactions.html">Transactions</a>
        <a href="settings.html">Settings</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="main-content">
        <h1>Manage Users</h1>
       
        <div style="margin-bottom: 2rem;">
            <button class="btn" onclick="showAddUser()">+ Add New User</button>
        </div>

        <div class="section">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Balance</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="7">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../main.js"></script>

    <script>
        // 2. Security Check
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const token = localStorage.getItem('token');
       
        if (!token || !user.is_staff) {
            alert('Admin access required!');
            window.location.href = '../login.html';
        }

        // 3. Load Real Users
        async function loadUsers() {
            const tableBody = document.getElementById('usersTable');
           
            try {
                // Call API
                const users = await API.getAllUsers();
               
                if (users.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7">No users found.</td></tr>';
                    return;
                }

                tableBody.innerHTML = users.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.first_name || ''} ${u.last_name || ''}</td>
                        <td>${u.email}</td>
                        <td>${u.phone || 'N/A'}</td>
                        <td>₦${(u.balance || 0).toLocaleString()}</td>
                        <td><span class="status-badge ${u.is_active ? 'active' : 'suspended'}">
                            ${u.is_active ? 'Active' : 'Suspended'}
                        </span></td>
                        <td>
                            <div class="user-actions">
                                <button class="btn btn-small btn-edit" onclick="editUser(${u.id})">Edit</button>
                                <button class="btn btn-small btn-delete" onclick="deleteUser(${u.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error(error);
                tableBody.innerHTML = '<tr><td colspan="7" style="color:red">Error loading users.</td></tr>';
            }
        }

        function showAddUser() {
            // You can link this to a separate add-user.html page or show a modal
            alert('Feature coming soon: Link to Add User Form');
        }

        function editUser(id) {
            // Link to edit-user.html?id=1
            alert(`Edit feature coming soon for User ${id}`);
        }

        // 4. Real Delete Function
        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user? This cannot be undone.')) {
                const success = await API.deleteUser(id);
                if (success) {
                    alert('User deleted successfully');
                    loadUsers(); // Refresh the list
                } else {
                    alert('Failed to delete user. Check permissions.');
                }
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
