<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FastVTU</title>
    <style>
        /* ... (Keep your existing CSS styles exactly as they are) ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #6c5ce7; --primary-dark: #5649c0; --secondary: #00d9ff; --success: #00b894; --danger: #ff4757; --warning: #ffa502; --dark: #2d3436; --light: #f5f6fa; --gray: #636e72; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .auth-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header h1 { color: var(--primary); margin-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--dark); font-weight: 500; }
        .form-group input { width: 100%; padding: 0.75rem; border: 2px solid #ddd; border-radius: 5px; font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .btn { width: 100%; background: var(--primary); color: white; padding: 0.75rem; border: none; border-radius: 5px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .form-footer { text-align: center; margin-top: 1.5rem; color: var(--gray); }
        .form-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .remember-forgot label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .remember-forgot a { color: var(--primary); text-decoration: none; }
        .loading-spinner { display: none; width: 20px; height: 20px; border: 2px solid transparent; border-top: 2px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        .btn.loading .loading-spinner { display: block; }
        .btn.loading .btn-text { display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--success); color: white; padding: 1rem 2rem; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transform: translateX(400px); transition: transform 0.3s; z-index: 2000; }
        .toast.show { transform: translateX(0); }
        .toast.error { background: var(--danger); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Login to your FastVTU account</p>
        </div>
       
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" required placeholder="Enter username or email">
            </div>
           
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
           
            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
           
            <button type="submit" class="btn" id="loginBtn">
                <div class="loading-spinner"></div>
                <span class="btn-text">Login</span>
            </button>
        </form>
       
        <div class="form-footer">
            Don't have an account? <a href="register.html">Sign up</a>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script src="main.js"></script>

    <script>
        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
           
            // Get values
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
           
            // Show loading
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
           
            try {
                // 2. CALL THE REAL API FUNCTION (From main.js)
                const response = await API.login(username, password);
               
                if (response.success) {
                    showToast('Login successful! Redirecting...');
                   
                    // Redirect to dashboard after 1 second
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    // Show error message from backend
                    showToast(response.message || 'Invalid credentials', 'error');
                }
            } catch (error) {
                console.error(error);
                showToast('Network error. Is your server running?', 'error');
            } finally {
                // Remove loading state
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
